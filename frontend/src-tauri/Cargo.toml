[package]
name = "image-sorter"
version = "0.1.0"
description = "Image Sorter — anime/gacha character categoriser"
authors = ["flytheonlyone"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "image_sorter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[features]
# Used by `tauri build --features custom-protocol`
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
